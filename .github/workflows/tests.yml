name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' numpy==1.26.4 imageio imageio-ffmpeg pillow
      - run: python -m pytest -q
      - run: ruff check src tests scripts examples participant
      - run: ruff format --check src tests scripts examples participant
      - run: python scripts/check_repository.py
